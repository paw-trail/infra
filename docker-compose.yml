# =============================================================================
# 함께하개(paw-trail) 로컬 개발 인프라
# =============================================================================
# 파일은 한 벌이고 켤 컨테이너는 프로파일로 고름
#
#   infra          kafka, redis
#   db             postgres (평소에는 켜지 않음, EC2 공용 인스턴스를 씀)
#   platform       gateway-server, eureka-server, config-server
#   observability  prometheus, grafana, loki, zipkin
#   edge           nginx
#   tools          kafka-ui
#   pipeline       ingest, extract
#   app            도메인 서비스 (auth 부터 하나씩 추가함)
#
# 아직 파일에 들어 있지 않은 것은 edge 의 nginx, pipeline 2종, app 의 나머지 13종임
# 해당 저장소가 완성되고 ghcr 에 이미지가 올라간 뒤에 추가함
#
# app 프로파일을 쓰려면 .env 의 COMPOSE_PROFILES 에 app 을 넣을 것
#   COMPOSE_PROFILES=infra,platform,db,tools,app
#   docker compose up -d
#
# * --profile 을 명령에 붙이면 .env 값이 대체됨(더해지지 않음)
#   docker compose --profile app up -d 만 쓰면 활성 프로파일이 app 하나가 되어
#   depends_on 이 가리키는 config-server·postgres 가 프로젝트에 없다는 오류가 남
#     service "auth-service" depends on undefined service "config-server"
#   .env 를 고치지 않고 한 번만 띄우려면 전부 나열할 것
#     docker compose --profile infra --profile platform --profile db --profile tools --profile app up -d
#
# 실행
#   docker compose up -d
#   .env 의 COMPOSE_PROFILES 가 평소 조합을 정하며 기본값은 infra,tools,observability 임
#
# 독립된 DB 가 필요할 때만 db 프로파일을 함께 켬
#   docker compose --profile db up -d
#
# 플랫폼 3종을 컨테이너로 띄울 때
#   docker compose --profile platform up -d
#
#   기동 순서가 정해져 있어 앞엣것이 준비될 때까지 뒤엣것이 기다림
#   셋이 모두 뜨는 데 1분 남짓 걸리며 진행 상황은 아래로 봄
#     docker compose ps
#     STATUS 가 (healthy) 로 바뀌면 준비된 것임
#
#   도메인 서비스는 개발 도구에서 띄우고 플랫폼만 컨테이너로 두는 조합이 편함
#   개발 도구에서 띄운 서비스도 유레카에 등록되며 게이트웨이가 찾아냄
#
# 문법만 검사(컨테이너는 안 띄움)
#   docker compose config
#
# 주의: profiles 가 없는 서비스는 어떤 프로파일을 켜든 항상 뜸
#      켜는 조합이 상황마다 갈리므로 모든 서비스에 라벨을 붙임
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # ---------------------------------------------------------------------------
  # 평소 개발에서는 EC2 공용 인스턴스를 쓰므로 이것을 띄우지 않음
  # 수집 데이터를 함께 써야 하고(수집 API 에 하루 호출 제한이 있음)
  # 추출 배치가 GPU 를 요구해 각자 재현할 수 없기 때문임
  #
  # 그럼에도 이 블록과 init-db/ 를 남겨 두는 이유는 둘임
  #   공통 모듈 검증처럼 독립된 DB 가 필요할 때 --profile db 로 켬
  #   EC2 에 PostgreSQL 을 세울 때 같은 init 스크립트를 그대로 씀
  postgres:
    image: postgis/postgis:17-3.5
    # postgis/postgis 는 공식적으로 amd64 만 지원함(README "Supported architecture: amd64")
    # 명시하지 않으면 Apple Silicon 에서 "platform does not match" 경고가 뜨는데
    # 경고인지 오류인지 헷갈리므로 의도적으로 에뮬레이션한다는 것을 표시해 둠
    platform: linux/amd64
    container_name: pawtrail-postgres
    profiles: [db]
    environment:
      # 컨테이너 기본 시간대는 UTC 임
      # 모든 시각을 timestamp(시간대 없음) + LocalDateTime 으로 통일했으므로
      # 이 값이 없으면 now() 와 로그가 9시간 어긋남
      TZ: Asia/Seoul
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # init-db/01-databases.sh 가 서비스 계정을 만들 때 읽음
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 17 의 데이터 경로임
      # 18 부터 /var/lib/postgresql 로 바뀌었음
      - postgres_data:/var/lib/postgresql/data
      # 이 디렉터리의 스크립트는 데이터 디렉터리가 비어 있을 때만 실행됨
      # 스크립트를 고친 뒤 다시 돌리려면 docker compose down -v 로 볼륨을 지워야 함
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Kafka (KRaft 겸임 모드 - 브로커와 컨트롤러가 한 프로세스)
  # ---------------------------------------------------------------------------
  # PostgreSQL 과 달리 각자 로컬에 두는 이유는 공용으로 쓰면
  # 한 사람이 발행한 이벤트를 다른 사람의 컨슈머가 가져가 서로의 테스트가 섞이기 때문임
  kafka:
    image: apache/kafka:4.1.2
    container_name: pawtrail-kafka
    profiles: [infra]
    environment:
      TZ: Asia/Seoul

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # 리스너가 셋인 이유
      #   INTERNAL   컨테이너끼리 (kafka:9092)
      #   EXTERNAL   호스트의 IntelliJ 에서 붙는 경로 (localhost:29092)
      #   CONTROLLER KRaft 합의용, 밖으로 열지 않음
      #
      # 브로커는 접속자에게 "나에게 오려면 이 주소로 와라"를 되돌려줌(advertised)
      # 리스너가 하나뿐이면 호스트에서 붙은 클라이언트가 kafka 라는 이름을 못 풀어 접속에 실패함
      # 도메인 서비스를 IntelliJ 로 돌리므로 EXTERNAL 이 필수임
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      # CONTROLLER 는 광고하지 않음
      # advertised 는 클라이언트가 찾아올 주소인데 컨트롤러 리스너는 클라이언트가 접속하는 대상이 아님
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # 브로커가 1대이므로 복제본도 1
      # 기본값 3 이면 내부 토픽 생성에서 실패함
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 컨슈머가 붙을 때마다 리밸런스를 기다리지 않게 함
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 자동 생성을 켜두면 컨슈머의 토픽명 오타가 조용히 빈 토픽을 만들고
      # 발행은 되는데 소비만 안 되는 상태가 됨
      # 토픽은 kafka/create-topics.sh 로 명시 생성함
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      # kafka/create-topics.sh 를 컨테이너 안에서 실행하기 위한 마운트임
      # 호스트 셸에 의존하지 않으므로 Windows PowerShell 과 macOS 에서 명령이 같음
      - ./kafka:/opt/scripts:ro
    healthcheck:
      # apache/kafka 이미지의 스크립트 경로는 /opt/kafka/bin 임
      # Confluent 이미지(cp-kafka)는 PATH 에 등록돼 있어 경로 없이 쓰지만 여기서는 다름
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      # KRaft 최초 기동은 스토리지 포맷까지 하므로 첫 헬스체크를 늦게 시작함
      start_period: 30s
    mem_limit: 1g
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  # 쓰는 곳은 리프레시 토큰, 판정 캐시, 조회수, 최근 본 장소, 비밀번호 재설정 코드임
  # 로컬에서는 영속이 필요 없으므로 볼륨을 잡지 않음
  redis:
    image: redis:8.2-alpine
    container_name: pawtrail-redis
    profiles: [infra]
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Kafka UI (kafbat)
  # ---------------------------------------------------------------------------
  # Kafdrop 은 KRaft 를 지원하지 않음
  # provectuslabs/kafka-ui 는 유지보수가 끝났고 kafbat 포크가 이어받았음
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: pawtrail-kafka-ui
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # 컨슈머 그룹 오프셋 리셋 등 쓰기 동작을 UI 에서 하려면 필요함
      # Outbox -> Inbox 검증에서 메시지를 다시 흘려보낼 때 씀
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports:
      # 컨테이너 내부는 8080 이고 우리 포트 배정은 9000 임
      - "9000:8080"
    mem_limit: 512m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # 플랫폼 3종
  # ---------------------------------------------------------------------------
  # 이미지는 ghcr 에서 받아 옴
  # Jenkins 가 생기기 전까지는 각 저장소에서 손으로 만들어 올리며
  # 그 절차는 README 에 있음
  #
  # 기동 순서가 정해져 있음
  #   config-server → eureka-server → gateway-server
  # 뒤엣것이 앞엣것에서 설정을 받아 오기 때문임
  #
  # * depends_on 만으로는 부족함
  #   그것은 "컨테이너가 시작됐다" 까지만 보장하고 "설정을 내려줄 준비가 됐다" 는
  #   보지 않음. 스프링 기동에 몇 초가 걸리므로 그 사이에 뒤엣것이 뜨면
  #   설정을 못 받은 채 시작됨
  #   본문 설정에 optional: 이 붙어 있어 그 실패가 조용히 지나가므로
  #   상태 검사로 실제 준비를 기다림
  #
  # * 상태 검사에 wget 을 쓰는 이유
  #   이미지 바탕이 Alpine 이라 curl 이 없음
  #   대신 BusyBox 의 wget 이 들어 있고 --spider 는 본문을 받지 않고
  #   응답 코드만 확인함
  #   액추에이터가 정상이면 200, 하나라도 문제가 있으면 503 을 주므로
  #   본문을 따로 들여다볼 필요가 없음

  config-server:
    image: ghcr.io/paw-trail/config-server:latest
    container_name: pawtrail-config-server
    profiles: [platform]
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      # * 이 서비스만 주소를 직접 넣어 줘야 함
      #   나머지 둘은 dev 프로파일이 config 저장소에서 주소를 내려주지만
      #   이 서비스는 자기 설정을 그 저장소에서 받지 않기 때문임
      #   저장소 주소를 알아야 저장소를 읽을 수 있어 그렇게 둔 것임
      #
      #   빠뜨리면 localhost 로 남는데 컨테이너 안에서 그것은 자기 자신이라
      #   유레카 등록이 영영 실패함
      #   다만 등록 실패가 기동을 막지는 않아 30초마다 재시도만 반복되므로
      #   유레카 화면에 이 서비스가 안 보이는 것으로 알아차리게 됨
      EUREKA_HOST: eureka-server
      LOKI_HOST: loki
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 스프링 기동에 몇 초가 걸림
      # 이 시간 동안의 실패는 재시도 횟수에 넣지 않음
      start_period: 40s
    mem_limit: 512m
    networks: [pawtrail]

  eureka-server:
    image: ghcr.io/paw-trail/eureka-server:latest
    container_name: pawtrail-eureka-server
    profiles: [platform]
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      # 설정 서버를 컨테이너 이름으로 찾음
      # 저장소의 기본값은 localhost 인데 컨테이너 안에서 그것은 자기 자신임
      CONFIG_HOST: config-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m
    networks: [pawtrail]

  gateway-server:
    image: ghcr.io/paw-trail/gateway-server:latest
    container_name: pawtrail-gateway-server
    profiles: [platform]
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev
      CONFIG_HOST: config-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 512m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # 도메인 서비스 (app)
  # ---------------------------------------------------------------------------
  # 개발이 끝난 서비스만 여기 둠
  # 지금 고치고 있는 서비스는 IntelliJ 로 띄우는 편이 빠름 (고칠 때마다 이미지를 다시 구워야 함)
  #
  # 이미지를 다시 받는 것은 up 만으로는 안 됨
  #   docker compose pull auth-service && docker compose --profile app up -d
  auth-service:
    image: ghcr.io/paw-trail/auth-service:latest
    container_name: pawtrail-auth-service
    profiles: [app]
    depends_on:
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: dev

      # * 컨테이너 안에서 localhost 는 자기 자신이므로 컨테이너 이름으로 붙음
      #   IntelliJ 로 띄울 때는 각자 실행 구성에 localhost 를 넣음
      #   값이 사람마다 다르지 않아 .env 로 빼지 않고 여기 적음
      CONFIG_HOST: config-server
      DB_HOST: postgres

      # * 아래는 사람마다 다르거나 비밀값이라 .env 에서 읽음
      #   .env 가 없거나 값이 비면 기동에 실패함 (기본값을 두지 않는 방침)
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
      AUTH_JWT_PRIVATE_KEY_B64: ${AUTH_JWT_PRIVATE_KEY_B64}
      AUTH_MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD}
      AUTH_OAUTH_GOOGLE_CLIENT_SECRET: ${AUTH_OAUTH_GOOGLE_CLIENT_SECRET}
    ports:
      # 8081 을 여는 이유
      #   게이트웨이를 거치지 않고 직접 확인할 때 씀
      #   구글 콘솔에 auth 직결 콜백 주소도 등록해 두었음
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Dockerfile 의 -XX:MaxRAMPercentage=70 이 이 값의 70% 까지 힙으로 씀
    mem_limit: 640m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  # TODO: 첫 pull 이후 실제 버전으로 고정할 것
  #      docker image inspect prom/prometheus:latest --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
  prometheus:
    image: prom/prometheus:latest
    container_name: pawtrail-prometheus
    profiles: [observability]
    environment:
      TZ: Asia/Seoul
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 로컬은 보관 기간을 짧게 잡아 디스크를 아낌
      - --storage.tsdb.retention.time=7d
      # /-/reload 로 설정을 다시 읽게 함
      # 타깃을 추가할 때마다 컨테이너를 재시작하지 않아도 됨
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Loki
  # ---------------------------------------------------------------------------
  # 로그는 loki-logback-appender 로 애플리케이션이 직접 push 함
  # 도커 로그 드라이버나 수집 에이전트를 두지 않는 이유는 도메인 서비스를 IntelliJ 에서 돌리기 때문임
  # 컨테이너 밖에서 도는 프로세스의 로그는 그 둘로는 잡히지 않음
  #
  # 이미지에 기본 설정 파일이 들어 있어 단일 바이너리 모드로 바로 뜸
  # 로컬에서는 보관이 필요 없으므로 볼륨을 잡지 않음
  loki:
    image: grafana/loki:latest
    container_name: pawtrail-loki
    profiles: [observability]
    environment:
      TZ: Asia/Seoul
    ports:
      - "3100:3100"
    mem_limit: 512m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Zipkin
  # ---------------------------------------------------------------------------
  # 저장소는 기본값인 인메모리를 씀
  # 로컬에서 지난 트레이스를 다시 볼 일이 없고 컨테이너가 자주 재생성되므로 볼륨이 의미가 없음
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: pawtrail-zipkin
    profiles: [observability]
    environment:
      TZ: Asia/Seoul
    ports:
      - "9411:9411"
    mem_limit: 512m
    networks: [pawtrail]

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  # 데이터소스 3개는 provisioning 으로 자동 등록됨
  # 볼륨을 안 잡았으므로 컨테이너를 새로 만들면 대시보드는 사라지지만
  # 데이터소스는 매번 같은 상태로 다시 뜸
  grafana:
    image: grafana/grafana:latest
    container_name: pawtrail-grafana
    profiles: [observability]
    depends_on:
      - prometheus
      - loki
      - zipkin
    environment:
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # 첫 로그인 시 비밀번호 변경을 강요하지 않음
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      # 로컬에서는 익명 열람을 허용해 매번 로그인하지 않게 함
      # 다만 익명은 Viewer 라 데이터소스 메뉴가 보이지 않으므로 설정을 볼 때는 로그인해야 함
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 플러그인 설치 시도를 막아 오프라인에서도 조용히 뜸
      GF_INSTALL_PLUGINS: ""
    ports:
      # 우리 포트 배정은 3000 이고 프론트를 5173 으로 뺀 이유가 이것임
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 512m
    networks: [pawtrail]

volumes:
  postgres_data:
  # Kafka 로그 디렉터리는 named volume 으로 잡지 않음
  # apache/kafka 이미지는 비루트 사용자로 도는데 이미지에 없는 경로에 빈 볼륨을 마운트하면
  # 그 디렉터리가 root 소유로 생성되어 브로커가 쓰지 못하고 기동에 실패함
  # 검증 중에는 매번 깨끗한 상태로 시작하는 편이 낫고 토픽 생성 스크립트가 멱등하므로
  # down 으로 데이터가 사라져도 재실행 한 번이면 복구됨
  # 영속이 필요해지면 그때 권한과 함께 잡을 것

networks:
  pawtrail:
    driver: bridge
