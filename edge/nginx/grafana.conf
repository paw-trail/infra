# =============================================================================
# grafana.paw-trail.click 앞단 nginx (Lightsail pawtrail-edge)
# =============================================================================
# 요청이 지나가는 길
#
#   브라우저 → Cloudflare → 이 nginx(443) → WireGuard 터널 → Grafana 10.8.0.2:3000 (미니 PC)
#
# Grafana 는 자체 로그인으로만 막음 — 서버에서는 익명 보기를 끔 (compose 의 GRAFANA_ANONYMOUS)
# Zipkin 화면은 로그인 기능이 없어 열지 않음 — 추적은 Grafana 의 Zipkin 데이터 소스로 봄
#
# 이 파일은 /etc/nginx/sites-available/grafana.conf 에 놓이고 http 블록 안에서 읽힘
# 제자리에 놓는 일은 install.sh 가 함
#
# paw-trail.conf 에 있는 것을 함께 씀 (같은 http 블록이라 그대로 보임)
#   $pawtrail_from_cloudflare   Cloudflare 를 거친 요청인지 (geo)
#   pawtrail_conn               IP 당 동시 연결 (limit_conn_zone)
#   pawtrail_ssl                TLS 세션 캐시 — 같은 이름 · 같은 크기면 여러 server 가 나눠 씀
# =============================================================================


# 로그인 호출 제한 — 사이트 로그인과 같은 값 (분당 10 · 순간 10)
#   Grafana 도 같은 계정이 연달아 틀리면 잠깐 막지만, 한 IP 가 여러 계정을 번갈아 두드리는 것은 여기서 막음
limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=10r/m;

# Grafana Live(웹소켓)에 넘길 Connection 헤더
map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pawtrail_grafana {
    server 10.8.0.2:3000;
}


# 우리 이름으로 온 http 는 https 로 보냄
# 평소에는 Cloudflare 의 항상 HTTPS 설정이 먼저 돌려보내서 여기까지 오지 않음
server {
    listen 80;
    listen [::]:80;
    server_name grafana.paw-trail.click;
    return 301 https://grafana.paw-trail.click$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.paw-trail.click;

    # 사이트와 같은 Cloudflare Origin 인증서 — *.paw-trail.click 도 덮음
    ssl_certificate     /etc/ssl/paw-trail/origin.pem;
    ssl_certificate_key /etc/ssl/paw-trail/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pawtrail_ssl:10m;
    ssl_session_timeout 1d;

    # Cloudflare 를 거치지 않은 요청은 끊음
    if ($pawtrail_from_cloudflare = 0) {
        return 444;
    }

    server_tokens off;

    # 대시보드 JSON 을 가져오기(import) 할 때 본문이 조금 큼
    client_max_body_size 5m;

    limit_conn          pawtrail_conn 30;
    limit_conn_status   429;
    limit_req_status    429;
    limit_req_log_level warn;

    # 화면을 다른 사이트에 끼워 넣지 못하게 하는 헤더는 Grafana 가 스스로 붙임 (allow_embedding 기본값 false)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # location 에서 proxy_set_header 를 하나라도 쓰면 여기 값이 통째로 안 내려감
    # 그래서 웹소켓 location 은 전부 다시 적음
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # 로그인 화면 · 로그인 요청
    location = /login {
        limit_req zone=grafana_login burst=10 nodelay;
        proxy_pass http://pawtrail_grafana;
    }

    # Grafana Live — 대시보드의 실시간 갱신이 쓰는 웹소켓
    location /api/live/ {
        proxy_pass http://pawtrail_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $grafana_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://pawtrail_grafana;
    }
}
