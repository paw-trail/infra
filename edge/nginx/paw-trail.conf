# =============================================================================
# paw-trail.click 앞단 nginx (Lightsail pawtrail-edge)
# =============================================================================
# 요청이 지나가는 길
#
#   브라우저 → Cloudflare → 이 nginx(443)
#     /api/   → WireGuard 터널 → 게이트웨이 10.8.0.2:8080 (미니 PC)
#     그 밖   → 프론트 빌드 결과 /var/www/paw-trail
#
# 이 파일은 /etc/nginx/sites-available/paw-trail.conf 에 놓이고 http 블록 안에서 읽힘
# 제자리에 놓는 일은 install.sh 가 함
#
# 같이 쓰는 파일
#   /etc/nginx/conf.d/cloudflare-realip.conf     진짜 사용자 IP 를 푸는 설정 (cloudflare-realip.sh 가 만듦)
#   /etc/nginx/snippets/cloudflare-ranges.inc    Cloudflare 주소 대역 (같은 스크립트가 만듦)
#   /etc/ssl/paw-trail/origin.pem · origin.key   Cloudflare Origin 인증서 (레포에 넣지 않음)
#   /var/www/paw-trail-maint/maintenance.html    점검 페이지
#
# 비상 스위치
#   sudo touch /etc/nginx/maintenance.on    사이트 전체가 503 점검으로 바뀜
#   sudo rm /etc/nginx/maintenance.on       바로 돌아옴 (nginx 를 다시 읽힐 필요 없음)
# =============================================================================


# -----------------------------------------------------------------------------
# 호출 제한 구역
# -----------------------------------------------------------------------------
# 키는 진짜 사용자 IP 임
#   cloudflare-realip.conf 가 $remote_addr 를 CF-Connecting-IP 값으로 바꿔 둠
#   그 설정이 없으면 모든 요청이 Cloudflare 서버 주소로 보여 사용자 전체가 한 통에 묶임
#
# 게이트웨이와 서비스에는 IP 기준 제한이 없어 여기가 유일한 자리임
#
#   auth     분당 10 · 순간 10     로그인 · 가입 · 비밀번호 재설정 · 이메일 인증
#   api      초당 10 · 순간 40     그 밖의 /api/
#   static   초당 20 · 순간 100    프론트 파일
#
# 정적 파일은 Cloudflare 가 캐시하지만 주소 뒤에 아무 쿼리나 붙이면 캐시를 비켜 여기까지 옴
# 그래서 정적 파일도 제한함
limit_req_zone  $binary_remote_addr zone=pawtrail_auth:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=pawtrail_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=pawtrail_static:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pawtrail_conn:10m;


# -----------------------------------------------------------------------------
# Cloudflare 를 거쳐 온 요청인지
# -----------------------------------------------------------------------------
# 원 서버 주소로 바로 들어온 요청은 Cloudflare 의 방어와 캐시를 건너뛰므로 받지 않음
# $realip_remote_addr 는 IP 를 풀기 전의 실제 접속 주소임 (Cloudflare 서버 주소)
# 127.0.0.1 은 이 서버 안에서 curl 로 확인할 때 쓰려고 엶
geo $realip_remote_addr $pawtrail_from_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    include /etc/nginx/snippets/cloudflare-ranges.inc;
}


# -----------------------------------------------------------------------------
# 게이트웨이 (미니 PC · WireGuard 터널 너머)
# -----------------------------------------------------------------------------
upstream pawtrail_gateway {
    server 10.8.0.2:8080;

    # 터널 너머로 매번 새로 연결하는 비용을 줄이려고 연결을 붙잡아 둠
    # 쓰려면 location 쪽에 proxy_http_version 1.1 과 빈 Connection 헤더가 있어야 함
    keepalive 16;
}


# -----------------------------------------------------------------------------
# 80 번
# -----------------------------------------------------------------------------
# 이름을 모르는 요청(주소로 바로 찌르는 스캐너 등)은 응답 없이 끊음
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 우리 이름으로 온 http 는 https 로 보냄
# 평소에는 Cloudflare 의 항상 HTTPS 설정이 먼저 돌려보내서 여기까지 오지 않음
server {
    listen 80;
    listen [::]:80;
    server_name paw-trail.click;
    return 301 https://paw-trail.click$request_uri;
}


# -----------------------------------------------------------------------------
# 443 번 — 이름을 모르는 요청
# -----------------------------------------------------------------------------
# 인증서를 내주지 않고 핸드셰이크에서 끊음
# 인증서 속 도메인 이름이 주소 스캐너에 드러나지 않게 하기 위함임
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}


# -----------------------------------------------------------------------------
# 443 번 — paw-trail.click
# -----------------------------------------------------------------------------
server {
    # http2 를 listen 에 붙이는 것은 nginx 1.24 (Ubuntu 24.04) 의 문법임
    # 1.25.1 부터는 http2 on; 이 따로 있으나 이 문법도 경고만 내고 그대로 동작함
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paw-trail.click;

    # Cloudflare Origin 인증서 (15년)
    # Cloudflare 만 믿는 인증서라 Cloudflare 를 끄면 브라우저가 경고함
    ssl_certificate     /etc/ssl/paw-trail/origin.pem;
    ssl_certificate_key /etc/ssl/paw-trail/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:pawtrail_ssl:10m;
    ssl_session_timeout 1d;

    # Cloudflare 를 거치지 않은 요청은 끊음
    # return 만 쓰는 if 라 안전함
    if ($pawtrail_from_cloudflare = 0) {
        return 444;
    }

    server_tokens off;
    charset utf-8;

    # 사진은 브라우저가 S3 로 바로 올리므로 여기로 큰 본문이 오지 않음
    client_max_body_size 1m;

    limit_conn          pawtrail_conn 30;
    limit_conn_status   429;
    limit_req_status    429;
    limit_req_log_level warn;

    # Cloudflare 까지 가는 전송량을 줄이려고 여기서도 압축함
    # Lightsail 은 나가는 전송량으로 과금되므로 압축한 만큼 아낌
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

    # location 안에서 add_header 를 쓰면 여기 값이 통째로 안 내려감
    # 그래서 캐시 헤더는 add_header 대신 expires 로만 줌
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /var/www/paw-trail;
    index index.html;

    # 점검 페이지
    # 점검 검사는 server 단계가 아니라 location 마다 둠
    # server 단계에 두면 점검 페이지로 넘어가는 내부 이동에서 또 걸려 기본 503 이 나감
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/paw-trail-maint;
        internal;
        expires -1;
    }

    # 프론트 화면
    # 없는 경로는 index.html 로 돌려 프론트의 라우터가 화면을 고르게 함
    # index.html 은 매번 새로 확인하게 해야 새 빌드가 바로 보임
    location / {
        if (-f /etc/nginx/maintenance.on) {
            return 503;
        }
        limit_req zone=pawtrail_static burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 빌드가 만든 파일 (이름에 내용 해시가 붙어 있어 내용이 바뀌면 이름도 바뀜)
    # 그래서 오래 캐시해도 됨
    location /assets/ {
        if (-f /etc/nginx/maintenance.on) {
            return 503;
        }
        limit_req zone=pawtrail_static burst=100 nodelay;
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # API — 게이트웨이로 넘김
    # /api/ 만 넘기므로 /actuator 같은 관리 경로는 밖에서 보이지 않음
    location /api/ {
        if (-f /etc/nginx/maintenance.on) {
            return 503;
        }
        limit_req zone=pawtrail_api burst=40 nodelay;

        # 점검 · 터널 끊김 · 게이트웨이 무응답은 우리 응답 모양의 JSON 으로 답함
        # 게이트웨이가 직접 낸 오류는 그대로 통과함 (그쪽 본문에 traceId 가 있음)
        error_page 502 503 504 = @api_unavailable;
        error_page 429 = @api_too_many;

        proxy_pass http://pawtrail_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # 진짜 사용자 IP 를 넘김
        # 사용자가 보낸 X-Forwarded-For 는 덧붙이지 않고 덮어써서 속일 수 없게 함
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Cloudflare 가 원 서버를 기다리는 한도가 100초라 그보다 짧게 둠
        proxy_connect_timeout 3s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;

        # 인증 구역 — 메일을 보내거나 비밀번호를 대입할 수 있는 경로만 더 조임
        # limit_req 를 여기서 새로 쓰면 바깥 api 구역 제한은 내려오지 않음
        # proxy_set_header · error_page 는 바깥 것이 그대로 내려옴
        location ~ ^/api/v1/auth/(login|signup|password/reset-request|password/reset|email/verify-request|email/verify)$ {
            if (-f /etc/nginx/maintenance.on) {
                return 503;
            }
            limit_req zone=pawtrail_auth burst=10 nodelay;
            proxy_pass http://pawtrail_gateway;
        }
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"잠시 서비스를 이용할 수 없습니다. 잠시 후 다시 시도해 주세요.","data":null,"traceId":null}';
    }

    location @api_too_many {
        default_type application/json;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","data":null,"traceId":null}';
    }
}
