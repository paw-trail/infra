<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>점검 중 · 함께하개</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: #faf7f2;
      color: #2b2b2b;
    }
    main { text-align: center; padding: 2rem 1.5rem; max-width: 28rem; }
    .paw { font-size: 3rem; line-height: 1; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { margin: 0.25rem 0; line-height: 1.6; color: #5a5a5a; }
    @media (prefers-color-scheme: dark) {
      body { background: #1d1b19; color: #eeeae4; }
      p { color: #b8b2a9; }
    }
  </style>
</head>
<body>
  <main>
    <div class="paw" aria-hidden="true">🐾</div>
    <h1>잠시 점검 중이에요</h1>
    <p>더 나은 함께하개를 위해 서비스를 손보고 있어요.</p>
    <p>잠시 후 다시 들러 주세요.</p>
  </main>
</body>
</html>
