# =============================================================================
# 미니 PC journald 보관 기간 — /etc/systemd/journald.conf.d/pawtrail.conf
# =============================================================================
# docker 컨테이너 로그를 journald 로 모으고(ops/install.sh 가 docker 로그 드라이버를 바꿈)
# 여기서 30일이 지난 것을 지움
# 개인정보처리방침 3장 「서비스 운영 기록 — 30일 뒤 삭제」 가 이 값에 걸려 있음
#
# docker 기본 로그(json-file)는 크기로만 자를 수 있어 조용한 서비스는 몇 달치가 남음
# journald 는 날짜로 지울 수 있고 docker logs 도 그대로 씀
#
# 이 설정은 미니 PC 의 시스템 로그 전체에 함께 적용됨
# =============================================================================
[Journal]
Storage=persistent
# 30일이 지난 기록을 지움
MaxRetentionSec=30day
# 파일을 하루 단위로 나눠야 30일이 하루 오차로 지켜짐 (기본은 한 달 단위)
MaxFileSec=1day
# 디스크를 다 차지하지 않게 전체 상한도 둠
SystemMaxUse=2G
