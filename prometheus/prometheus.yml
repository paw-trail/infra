# =============================================================================
# Prometheus 수집 설정 (로컬 · 서버 공통)
# =============================================================================
# 스프링 서비스는 유레카에 물어서 찾음 (eureka_sd_configs)
#   유레카에 등록된 인스턴스마다 IP:포트 의 /actuator/prometheus 를 모음
#   서비스가 늘어도 이 파일을 고칠 필요가 없고, 배포 중 잠깐 뜨는 임시 인스턴스(-next)도 따라감
#   유레카가 잠깐 죽어도 마지막으로 받은 목록으로 계속 모음
#
#   예전에는 host.docker.internal:포트 목록을 손으로 적었음
#     서비스를 IntelliJ 로 호스트에서 돌리던 로컬 개발용이었고
#     서버(리눅스)에는 host.docker.internal 이 없어 서비스가 전부 down 이었음
#     목록도 새 서비스 넷(weather · report · notification · review)보다 늦게 따라갔음
#
# 로컬에서 IntelliJ 로 띄운 서비스
#   유레카에 호스트의 IP 로 등록됨 (prefer-ip-address)
#   그 IP 가 컨테이너에서 닿는 환경이면 그대로 모이고, 닿지 않으면 그 서비스만 down 으로 보임
#   컨테이너로 띄운 서비스는 늘 모임
#
# 이 파일은 파일 하나를 컨테이너에 붙여 둔 것이라
# git pull 로 바뀐 뒤에는 다시 읽기(/-/reload)로는 안 보이고 컨테이너를 다시 시작해야 함
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 스프링 서비스 — 유레카에 등록된 인스턴스 전부
  # 액추에이터 노출 경로가 /actuator/prometheus 라 metrics_path 를 바꿔야 함
  # 기본값 /metrics 로 두면 404 만 받고 조용히 아무것도 안 모임
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://eureka-server:8761/eureka
        refresh_interval: 30s
    relabel_configs:
      # 유레카의 앱 이름은 대문자(AUTH-SERVICE)라 소문자로 바꿔 application 라벨에 둠
      # Loki 의 app 라벨과 같은 이름이 되어 대시보드에서 둘을 한 변수로 고를 수 있음
      - source_labels: [__meta_eureka_app_name]
        target_label: application
        action: lowercase
      # 인스턴스 이름은 유레카의 인스턴스 id (컨테이너 호스트 이름:서비스:포트)
      # 배포 중에는 한 서비스에 인스턴스가 둘 보임
      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance

  # 유레카 자신 — 자기 자신에게는 등록하지 않으므로 따로 적음
  # 로컬 · 서버 모두 컨테이너로 돌아 이름으로 찾음
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]
        labels:
          application: eureka-server

  # Loki
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
