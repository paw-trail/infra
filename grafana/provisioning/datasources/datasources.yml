# =============================================================================
# Grafana 데이터소스 자동 등록
# =============================================================================
# 이 파일이 없으면 컨테이너를 새로 만들 때마다 UI 에서 데이터소스 3개를 손으로 등록해야 함
# 볼륨을 안 잡았으므로 재생성이 잦고, 프로비저닝으로 두면 항상 같은 상태로 뜸
#
# *url 이 컨테이너 이름인 이유는 Grafana 도 같은 도커 네트워크 안에 있기 때문임
# 브라우저 주소(localhost:3000 등)와 혼동하지 말 것
# =============================================================================

apiVersion: 1

# 이미 등록된 두 데이터 소스를 지우고 아래에서 새로 만듦
#   uid 를 정하기 전에는 Grafana 가 무작위 uid 로 등록해 두었음
#   그 상태에서 uid 를 새로 적으면 Grafana 13 은 이름으로 찾은 뒤 새 uid 로 고치려다
#   「Datasource provisioning error: data source not found」 로 멈추고 아예 뜨지 않음
#   지우고 새로 만들면 처음부터 정한 uid 로 들어감
# 뜰 때마다 지우고 새로 만들어도 설정이 전부 이 파일에 있어 잃는 것이 없음
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:

  # uid 를 정해 두는 것은 대시보드 JSON 이 이 이름으로 데이터 소스를 가리키기 때문임
  # 정하지 않으면 Grafana 가 무작위 uid 를 붙여 대시보드가 데이터 소스를 못 찾음
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 로그의 traceId 를 눌러 Zipkin 추적으로 건너뛰게 함
      #   Loki 로 가는 로그 본문은 메시지뿐이라(%msg) traceId 가 본문에 없음
      #   traceId 는 structured metadata 로 붙어 오므로(common 의 logback-loki-appender.xml)
      #   본문을 정규식으로 찾지 않고 그 이름의 값(label)을 집음
      derivedFields:
        - name: traceId
          matcherType: label
          matcherRegex: traceId
          url: "$${__value.raw}"
          datasourceUid: zipkin
          urlDisplayLabel: Zipkin 에서 추적 보기

  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
