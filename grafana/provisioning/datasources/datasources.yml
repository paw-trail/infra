# =============================================================================
# Grafana 데이터소스 자동 등록
# =============================================================================
# 이 파일이 없으면 컨테이너를 새로 만들 때마다 UI 에서 데이터소스 3개를 손으로 등록해야 함
# 볼륨을 안 잡았으므로 재생성이 잦고, 프로비저닝으로 두면 항상 같은 상태로 뜸
#
# *url 이 컨테이너 이름인 이유는 Grafana 도 같은 도커 네트워크 안에 있기 때문임
# 브라우저 주소(localhost:3000 등)와 혼동하지 말 것
# =============================================================================

apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # 로그에 찍힌 traceId 를 눌러 Zipkin 트레이스로 건너뛰게 함
      # 우리는 logging.pattern.level 에 traceId 를 이미 박아 두었으므로 바로 걸림
      derivedFields:
        - name: TraceID
          matcherRegex: "([0-9a-f]{32})"
          url: "$${__value.raw}"
          datasourceUid: zipkin

  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411
    editable: false
